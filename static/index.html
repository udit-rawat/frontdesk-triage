<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrontDesk — intake queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbfbf9;
    --card: #ffffff;
    --ink: #14181c;
    --slate: #5a6570;
    --faint: #8a939b;
    --rule: #e3e5e1;
    --wash: #eef1ee;
    --urgent: #b3261e;
    --high: #a2570a;
    --medium: #35618e;
    --low: #6c7a80;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --serif: "Newsreader", Iowan Old Style, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 400 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  textarea { font: inherit; color: inherit; }

  /* ---- frame ---- */
  .bar {
    display: flex; align-items: baseline; gap: 14px;
    padding: 14px 22px; border-bottom: 1px solid var(--rule); background: var(--card);
  }
  .mark { font-weight: 600; letter-spacing: -0.015em; font-size: 17px; }
  .bar .what { color: var(--slate); font-size: 13.5px; }
  .bar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--faint); }
  .ghost {
    background: none; border: 1px solid var(--rule); border-radius: 3px;
    padding: 5px 11px; color: var(--slate); font-size: 12.5px;
  }
  .ghost:hover { border-color: var(--slate); color: var(--ink); }

  .frame { display: grid; grid-template-columns: 336px minmax(0, 1fr); height: calc(100% - 55px); }
  .queue { border-right: 1px solid var(--rule); background: var(--card); display: flex; flex-direction: column; min-height: 0; }
  #rows { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  .detail { overflow-y: auto; padding: 34px 40px 80px; }

  /* ---- queue ---- */
  .queue h2, .pane-title {
    margin: 0; font-size: 12.5px; font-weight: 500; color: var(--faint);
  }
  .queue h2 { padding: 16px 18px 10px; }
  .row {
    display: block; width: 100%; text-align: left; background: none;
    border: 0; border-bottom: 1px solid var(--rule);
    padding: 11px 18px 12px 20px; position: relative;
  }
  .row::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--spine, transparent);
  }
  .row[data-untriaged]::before { background: repeating-linear-gradient(180deg, var(--rule) 0 4px, transparent 4px 8px); }
  .row:hover { background: var(--paper); }
  .row[aria-current="true"] { background: var(--wash); }
  .row-top { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; }
  .row-id { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .verdict { font-size: 12.5px; font-weight: 500; color: var(--spine, var(--faint)); }
  .row[data-untriaged] .verdict { font-weight: 400; color: var(--faint); }
  .row-cat { font-size: 12.5px; color: var(--slate); margin-left: auto; }
  .row-text {
    font-family: var(--serif); font-size: 14px; line-height: 1.38; color: var(--slate);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .row[aria-current="true"] .row-text { color: var(--ink); }

  .compose { flex: 0 0 auto; padding: 14px 18px 18px; border-top: 1px solid var(--rule); background: var(--card); }
  .compose textarea {
    width: 100%; min-height: 84px; resize: vertical; padding: 10px 11px;
    border: 1px solid var(--rule); border-radius: 3px; background: var(--paper);
    font-family: var(--serif); font-size: 14.5px; line-height: 1.45;
  }
  .compose textarea:focus-visible, .draft textarea:focus-visible { outline: 2px solid var(--medium); outline-offset: 1px; }
  .solid {
    margin-top: 9px; width: 100%; background: var(--ink); color: var(--paper);
    border: 0; border-radius: 3px; padding: 9px 14px; font-weight: 500;
  }
  .solid:disabled { background: var(--faint); cursor: progress; }

  /* ---- detail ---- */
  .detail-inner { max-width: 680px; }
  .empty { color: var(--slate); font-family: var(--serif); font-size: 18px; max-width: 34ch; margin-top: 12vh; }

  .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .head .n { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .head .stamp { margin-left: auto; font-size: 12.5px; color: var(--faint); }

  .message {
    font-family: var(--serif); font-size: 19px; line-height: 1.52; margin: 0 0 30px;
    padding-left: 16px; border-left: 3px solid var(--spine, var(--rule));
  }

  .band { border-top: 1px solid var(--ink); padding-top: 6px; margin: 30px 0 14px; }
  .band span { font-size: 12.5px; color: var(--faint); }

  .summary { font-size: 16px; line-height: 1.5; margin: 0 0 22px; }

  .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .verdicts > div { background: var(--card); padding: 13px 14px 12px; }
  .verdicts .v { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
  .verdicts .k { font-size: 12px; color: var(--faint); margin-top: 3px; }
  .verdicts .priority .v { color: var(--spine); }
  .confidence {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--rule); border-top: 0; padding: 9px 14px;
    font-size: 12.5px; color: var(--slate);
  }
  .meter { flex: 1; max-width: 180px; height: 3px; background: var(--rule); }
  .meter i { display: block; height: 3px; background: var(--slate); }
  .confidence .hedge { margin-left: auto; color: var(--faint); }

  .why { font-size: 14.5px; color: var(--slate); margin: 12px 0 0; }
  .why b { color: var(--ink); font-weight: 500; }

  .notes { margin: 16px 0 0; padding: 0; list-style: none; }
  .notes li {
    font-size: 13.5px; color: var(--ink); background: #fdf6e6;
    border-left: 3px solid var(--high); padding: 8px 12px; margin-bottom: 6px;
  }
  .notes li.rules { background: #fbeceb; border-left-color: var(--urgent); }

  .draft textarea {
    width: 100%; min-height: 168px; resize: vertical; padding: 16px 18px;
    border: 1px solid var(--rule); border-radius: 3px; background: var(--card);
    font-family: var(--serif); font-size: 16.5px; line-height: 1.6;
  }
  .draft-actions { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .draft-actions .note { font-size: 12.5px; color: var(--faint); }

  .provenance { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--faint); }

  .working { display: flex; align-items: center; gap: 10px; color: var(--slate); font-size: 14.5px; margin-top: 26px; }
  .working i { width: 9px; height: 9px; border-radius: 50%; background: var(--medium); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  .settle { animation: settle .34s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes settle { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  @media (max-width: 880px) {
    .frame { grid-template-columns: 1fr; height: auto; }
    .queue { border-right: 0; border-bottom: 1px solid var(--rule); }
    .detail { padding: 26px 20px 60px; }
    .message { font-size: 17px; }
    .verdicts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="bar">
  <span class="mark">FrontDesk</span>
  <span class="what">Inbound requests, triaged and drafted for review</span>
  <span class="right">
    <span id="modelName"></span>
    <button class="ghost" id="resetBtn">Reset queue</button>
  </span>
</header>

<div class="frame">
  <nav class="queue" aria-label="Request queue">
    <h2>Queue <span id="queueCount"></span></h2>
    <div id="rows"></div>
    <div class="compose">
      <label for="newText" class="pane-title">Paste a new request</label>
      <textarea id="newText" placeholder="A client just emailed…" style="margin-top:8px"></textarea>
      <button class="solid" id="newBtn">Triage it</button>
    </div>
  </nav>

  <main class="detail"><div class="detail-inner" id="detail">
    <p class="empty">Pick a request from the queue, or paste a new one to see how it gets triaged.</p>
  </div></main>
</div>

<script>
const SPINE = { Urgent: "var(--urgent)", High: "var(--high)", Medium: "var(--medium)", Low: "var(--low)" };
let requests = [];
let selected = null;
let busy = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, opts) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

function drawQueue() {
  const open = requests.filter(r => !r.triage).length;
  document.getElementById("queueCount").textContent =
    open ? `— ${open} of ${requests.length} not triaged` : `— all ${requests.length} triaged`;
  document.getElementById("rows").innerHTML = requests.map(r => {
    const t = r.triage;
    const spine = t ? SPINE[t.priority] : "";
    return `<button class="row" data-id="${r.id}" aria-current="${r.id === selected}"
      ${t ? "" : "data-untriaged"} style="--spine:${spine}">
      <span class="row-top">
        <span class="row-id">${esc(r.seeded ? "Request " + r.id : "New")}</span>
        <span class="verdict">${t ? esc(t.priority) : "Not triaged"}</span>
        ${t ? `<span class="row-cat">${esc(t.category)}</span>` : ""}
      </span>
      <span class="row-text">${esc(r.text)}</span>
    </button>`;
  }).join("");
}

function working(message) {
  document.getElementById("detail").innerHTML =
    `<div class="working"><i></i><span>${esc(message)}</span></div>`;
}

function drawDetail() {
  const r = requests.find(x => x.id === selected);
  const el = document.getElementById("detail");
  if (!r) return;
  const t = r.triage;
  const spine = t ? SPINE[t.priority] : "var(--rule)";

  if (!t) {
    el.innerHTML = `
      <div class="head"><span class="n">Request ${esc(r.id)}</span></div>
      <p class="message" style="--spine:${spine}">${esc(r.text)}</p>
      <button class="solid" style="width:auto" id="runBtn">Run triage</button>`;
    document.getElementById("runBtn").onclick = () => runTriage(r.text, r.id);
    return;
  }

  const notes = (r.notes || []).map(n =>
    `<li class="${r.source === "rules" ? "rules" : ""}">${esc(n)}</li>`).join("");

  el.innerHTML = `
    <div class="head">
      <span class="n">${esc(r.seeded ? "Request " + r.id : "New request")}</span>
      <span class="stamp">${esc(r.created_at.replace("T", " ").replace("+00:00", " UTC"))}</span>
    </div>
    <p class="message" style="--spine:${spine}">${esc(r.text)}</p>

    <div class="band settle"><span>Triage</span></div>
    <p class="summary">${esc(t.summary)}</p>
    <div class="verdicts settle" style="--spine:${spine}">
      <div><div class="v">${esc(t.category)}</div><div class="k">Category</div></div>
      <div class="priority"><div class="v">${esc(t.priority)}</div><div class="k">Priority</div></div>
      <div><div class="v">${esc(t.owner)}</div><div class="k">Routed to</div></div>
    </div>
    <div class="confidence settle">
      <span>Confidence ${t.confidence.toFixed(2)}</span>
      <span class="meter"><i style="width:${Math.round(t.confidence * 100)}%"></i></span>
      <span class="hedge">${t.confidence < 0.6 ? "Low. Read this one yourself before acting." : "Still worth a human read."}</span>
    </div>
    <p class="why"><b>Why this priority.</b> ${esc(t.priority_reason)}</p>
    ${notes ? `<ul class="notes">${notes}</ul>` : ""}

    <div class="band"><span>Draft reply</span></div>
    <div class="draft">
      <textarea id="draft">${esc(t.draft_reply)}</textarea>
      <div class="draft-actions">
        <button class="ghost" id="copyBtn">Copy reply</button>
        <button class="ghost" id="saveBtn">Save edit</button>
        <span class="note" id="draftNote">Read it before you send it.</span>
      </div>
    </div>

    <p class="provenance">${r.source === "rules"
      ? "Answered by the keyword rule engine because the model was unreachable."
      : `Answered by ${esc(r.model)}${r.source === "model+policy" ? ", adjusted by policy" : ""}`}
      in ${(r.latency_ms / 1000).toFixed(1)}s.</p>`;

  document.getElementById("copyBtn").onclick = async () => {
    await navigator.clipboard.writeText(document.getElementById("draft").value);
    document.getElementById("draftNote").textContent = "Copied.";
  };
  document.getElementById("saveBtn").onclick = async () => {
    const draft_reply = document.getElementById("draft").value;
    const updated = await api(`/api/requests/${r.id}/draft`, { method: "PUT", body: JSON.stringify({ draft_reply }) });
    Object.assign(r, updated);
    document.getElementById("draftNote").textContent = "Saved.";
  };
}

async function runTriage(text, id) {
  if (busy) return;
  busy = true;
  working("Reading the request…");
  try {
    const updated = await api("/api/triage", { method: "POST", body: JSON.stringify({ text, id: id || null }) });
    requests = await api("/api/requests");
    selected = updated.id;
    drawQueue(); drawDetail();
  } catch (err) {
    document.getElementById("detail").innerHTML =
      `<p class="empty">Triage could not run: ${esc(err.message)}. Check the server is up and GROQ_API_KEY is set, then try again.</p>`;
  } finally {
    busy = false;
  }
}

document.getElementById("rows").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  selected = row.dataset.id;
  drawQueue(); drawDetail();
});

document.getElementById("newBtn").onclick = () => {
  const box = document.getElementById("newText");
  const text = box.value.trim();
  if (!text) { box.focus(); return; }
  box.value = "";
  runTriage(text, null);
};

document.getElementById("resetBtn").onclick = async () => {
  await api("/api/reset", { method: "POST" });
  requests = await api("/api/requests");
  selected = null;
  drawQueue();
  document.getElementById("detail").innerHTML =
    `<p class="empty">Pick a request from the queue, or paste a new one to see how it gets triaged.</p>`;
};

(async function start() {
  const health = await api("/api/health");
  document.getElementById("modelName").textContent = health.model;
  requests = await api("/api/requests");
  drawQueue();
})();
</script>
</body>
</html>
