<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrontDesk — intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #ffffff;
    --black: #000000;
    --grey: #6e6e6e;
    --mid: #9a9a9a;
    --rule: #d6d6d6;
    --fill: #f1f1ef;
    --signal: #e5231b;
    --sans: Archivo, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --gut: 24px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--white); color: var(--black);
    font: 400 14px/1.45 var(--sans);
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  textarea { font: inherit; color: inherit; }
  ::selection { background: var(--black); color: var(--white); }

  /* ---------- masthead ---------- */
  .bar {
    display: flex; align-items: baseline; gap: 16px;
    height: 52px; padding: 0 var(--gut);
    border-bottom: 2px solid var(--black);
  }
  .mark { font-weight: 700; font-size: 16px; letter-spacing: 0.04em; }
  .bar .what { font-size: 13px; color: var(--grey); }
  .bar .right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
  .tally { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
  .tally.hot { color: var(--signal); }
  .engine { font-size: 12px; color: var(--mid); }

  .btn {
    border: 1px solid var(--black); background: var(--white); border-radius: 0;
    padding: 6px 12px; font-size: 12px; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .btn:hover { background: var(--black); color: var(--white); }
  .btn:focus-visible, .row:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--signal); outline-offset: 1px;
  }
  .btn.filled { background: var(--black); color: var(--white); }
  .btn.filled:hover { background: var(--white); color: var(--black); }
  .btn.filled:disabled { background: var(--mid); border-color: var(--mid); color: var(--white); cursor: progress; }

  /* ---------- frame ---------- */
  .frame { display: grid; grid-template-columns: 328px minmax(0, 1fr); height: calc(100% - 52px); }
  .queue { border-right: 1px solid var(--black); display: flex; flex-direction: column; min-height: 0; }
  .detail { overflow-y: auto; padding: 28px var(--gut) 96px; }

  /* ---------- queue ---------- */
  .queue-head {
    display: flex; align-items: baseline; gap: 8px;
    padding: 10px var(--gut) 9px; border-bottom: 1px solid var(--black);
    font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; font-weight: 600;
  }
  .queue-head .n { margin-left: auto; color: var(--grey); font-weight: 500; letter-spacing: 0.04em; }
  #rows { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

  .row {
    display: block; width: 100%; text-align: left; background: none;
    border: 0; border-bottom: 1px solid var(--rule);
    padding: 11px var(--gut) 12px;
  }
  .row:hover { background: var(--fill); }
  .row[aria-current="true"] { background: var(--black); color: var(--white); }
  .row[aria-current="true"] .row-cat, .row[aria-current="true"] .row-text { color: var(--white); }

  .row-top { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; }
  .swatch { width: 11px; height: 11px; flex: none; border: 1px solid currentColor; }
  .swatch.urgent { background: var(--signal); border-color: var(--signal); }
  .swatch.high   { background: currentColor; }
  .swatch.medium { background: currentColor; opacity: 0.42; }
  .swatch.low    { background: none; }
  .swatch.none   { border-style: dotted; opacity: 0.5; }
  .row-id { font-size: 12px; font-weight: 600; letter-spacing: 0.03em; }
  .row-pri { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; }
  .row-pri.urgent { color: var(--signal); }
  .row[aria-current="true"] .row-pri.urgent { color: #ff6a60; }
  .row-pri.none { color: var(--mid); font-weight: 500; }
  .row-cat { margin-left: auto; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--grey); }
  .row-text {
    font-size: 13px; line-height: 1.38; color: var(--grey);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .compose { flex: none; border-top: 1px solid var(--black); padding: 14px var(--gut) 16px; }
  .compose label {
    display: block; font-size: 11px; letter-spacing: 0.09em;
    text-transform: uppercase; font-weight: 600; margin-bottom: 7px;
  }
  textarea {
    width: 100%; border: 1px solid var(--rule); border-radius: 0; background: var(--white);
    padding: 9px 10px; resize: vertical; font-size: 13.5px; line-height: 1.45;
  }
  .compose textarea { min-height: 74px; }
  .compose .btn { width: 100%; margin-top: 9px; padding: 9px; }

  /* ---------- detail ---------- */
  .inner { max-width: 700px; }
  .empty { color: var(--grey); font-size: 15px; max-width: 40ch; margin-top: 14vh; }

  .doc-head {
    display: flex; align-items: baseline; gap: 12px;
    border-bottom: 2px solid var(--black); padding-bottom: 7px; margin-bottom: 20px;
  }
  .doc-head .id { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .doc-head .kind { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; font-weight: 600; }
  .doc-head .stamp { margin-left: auto; font-size: 11.5px; color: var(--grey); }

  .message { font-size: 18px; line-height: 1.5; margin: 0 0 28px; max-width: 62ch; }

  .band {
    display: flex; align-items: baseline; border-top: 1px solid var(--black);
    padding-top: 6px; margin: 0 0 12px;
    font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; font-weight: 600;
  }
  .band .aside { margin-left: auto; font-weight: 500; letter-spacing: 0.04em; color: var(--grey); text-transform: none; }

  .summary { font-size: 15px; line-height: 1.5; margin: 0 0 22px; max-width: 62ch; }

  .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--black); }
  .verdicts > div { padding: 12px 16px 13px 0; }
  .verdicts .v { font-size: 17px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.1; }
  .verdicts .v.urgent { color: var(--signal); }
  .verdicts .k { font-size: 11px; color: var(--grey); margin-top: 5px; letter-spacing: 0.04em; }

  .conf { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--rule); padding: 10px 0 0; }
  .meter { display: flex; gap: 2px; }
  .meter i { width: 13px; height: 8px; border: 1px solid var(--black); }
  .meter i.on { background: var(--black); }
  .meter i.warn { border-color: var(--signal); }
  .meter i.on.warn { background: var(--signal); }
  .conf .num { font-size: 13px; font-weight: 600; }
  .conf .hedge { margin-left: auto; font-size: 12px; color: var(--grey); }

  .why { font-size: 14px; line-height: 1.5; margin: 18px 0 0; max-width: 62ch; }
  .why .lab {
    display: block; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
    font-weight: 600; color: var(--grey); margin-bottom: 3px;
  }

  .notes { margin: 20px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
  .notes li {
    display: flex; gap: 10px; align-items: baseline;
    font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--rule);
  }
  .notes li::before { content: ""; width: 9px; height: 9px; flex: none; background: var(--black); }
  .notes li.alert::before { background: var(--signal); }

  .draft { margin-top: 0; }
  .draft textarea { min-height: 172px; border-color: var(--black); padding: 16px 18px; font-size: 15px; line-height: 1.6; }
  .draft-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .draft-actions .note { font-size: 12px; color: var(--grey); }

  .provenance {
    margin-top: 30px; padding-top: 9px; border-top: 1px solid var(--rule);
    font-size: 11.5px; letter-spacing: 0.03em; color: var(--grey);
  }

  .working { display: flex; align-items: center; gap: 11px; margin-top: 24px; font-size: 14px; color: var(--grey); }
  .working i { width: 10px; height: 10px; background: var(--black); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .settle { animation: settle .22s ease-out both; }
  @keyframes settle { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  @media (max-width: 880px) {
    .frame { grid-template-columns: 1fr; height: auto; }
    .queue { border-right: 0; border-bottom: 2px solid var(--black); }
    .detail { padding: 22px 16px 60px; }
    .message { font-size: 16px; }
    .verdicts { grid-template-columns: 1fr; }
    .verdicts > div { border-bottom: 1px solid var(--rule); }
  }
</style>
</head>
<body>
<header class="bar">
  <span class="mark">FRONTDESK</span>
  <span class="what">Inbound requests, triaged and drafted for review</span>
  <span class="right">
    <span class="tally" id="tally"></span>
    <span class="engine" id="engine"></span>
    <button class="btn" id="resetBtn">Reset queue</button>
  </span>
</header>

<div class="frame">
  <nav class="queue" aria-label="Request queue">
    <div class="queue-head"><span>Queue</span><span class="n" id="queueCount"></span></div>
    <div id="rows"></div>
    <div class="compose">
      <label for="newText">Paste a new request</label>
      <textarea id="newText" placeholder="A client just emailed&hellip;"></textarea>
      <button class="btn filled" id="newBtn">Triage it</button>
    </div>
  </nav>

  <main class="detail"><div class="inner" id="detail">
    <p class="empty">Pick a request from the queue, or paste a new one to see how it gets triaged.</p>
  </div></main>
</div>

<script>
const CLASS = { Urgent: "urgent", High: "high", Medium: "medium", Low: "low" };
let requests = [];
let selected = null;
let busy = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, opts) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

function drawQueue() {
  const untriaged = requests.filter(r => !r.triage).length;
  const urgent = requests.filter(r => r.triage && r.triage.priority === "Urgent").length;
  document.getElementById("queueCount").textContent =
    untriaged ? `${untriaged} of ${requests.length} not triaged` : `all ${requests.length} triaged`;
  const tally = document.getElementById("tally");
  tally.textContent = urgent ? `${urgent} urgent` : "";
  tally.className = "tally" + (urgent ? " hot" : "");

  document.getElementById("rows").innerHTML = requests.map(r => {
    const t = r.triage;
    const cls = t ? CLASS[t.priority] : "none";
    return `<button class="row" data-id="${r.id}" aria-current="${r.id === selected}">
      <span class="row-top">
        <span class="swatch ${cls}"></span>
        <span class="row-id">${esc(r.seeded ? r.id : "NEW")}</span>
        <span class="row-pri ${cls}">${t ? esc(t.priority) : "Untriaged"}</span>
        ${t ? `<span class="row-cat">${esc(t.category)}</span>` : ""}
      </span>
      <span class="row-text">${esc(r.text)}</span>
    </button>`;
  }).join("");
}

function meter(value, warn) {
  const filled = Math.round(value * 10);
  return Array.from({ length: 10 }, (_, i) =>
    `<i class="${i < filled ? "on" : ""}${warn ? " warn" : ""}"></i>`).join("");
}

function drawDetail() {
  const r = requests.find(x => x.id === selected);
  const el = document.getElementById("detail");
  if (!r) return;
  const t = r.triage;
  const label = r.seeded ? r.id : "NEW";

  if (!t) {
    el.innerHTML = `
      <div class="doc-head"><span class="id">${esc(label)}</span><span class="kind">Untriaged</span></div>
      <p class="message">${esc(r.text)}</p>
      <button class="btn filled" id="runBtn" style="padding:9px 18px">Run triage</button>`;
    document.getElementById("runBtn").onclick = () => runTriage(r.text, r.id);
    return;
  }

  const degraded = r.source === "rules";
  const notes = (r.notes || []).map(n => `<li class="${degraded ? "alert" : ""}">${esc(n)}</li>`).join("");
  const pcls = CLASS[t.priority];

  el.innerHTML = `
    <div class="doc-head">
      <span class="id">${esc(label)}</span>
      <span class="kind">${esc(t.category)} request</span>
      <span class="stamp">${esc(r.created_at.replace("T", " ").replace("+00:00", " UTC"))}</span>
    </div>
    <p class="message">${esc(r.text)}</p>

    <div class="band settle"><span>Triage</span></div>
    <p class="summary">${esc(t.summary)}</p>

    <div class="verdicts settle">
      <div><div class="v">${esc(t.category)}</div><div class="k">Category</div></div>
      <div><div class="v ${pcls}">${esc(t.priority)}</div><div class="k">Priority</div></div>
      <div><div class="v">${esc(t.owner)}</div><div class="k">Routed to</div></div>
    </div>
    <div class="conf">
      <span class="meter">${meter(t.confidence, t.confidence < 0.6)}</span>
      <span class="num">${t.confidence.toFixed(2)}</span>
      <span class="hedge">${t.confidence < 0.6
        ? "Low confidence. Read this one yourself before acting."
        : "Confident, but still worth a human read."}</span>
    </div>

    <p class="why"><span class="lab">Why this priority</span>${esc(t.priority_reason)}</p>
    ${notes ? `<ul class="notes">${notes}</ul>` : ""}

    <div class="band" style="margin-top:30px">
      <span>Draft reply</span><span class="aside">Nothing is sent from here</span>
    </div>
    <div class="draft">
      <textarea id="draft">${esc(t.draft_reply)}</textarea>
      <div class="draft-actions">
        <button class="btn" id="copyBtn">Copy reply</button>
        <button class="btn" id="saveBtn">Save edit</button>
        <span class="note" id="draftNote"></span>
      </div>
    </div>

    <p class="provenance">${degraded
      ? "Answered by the keyword rule engine. No model was reachable."
      : `Answered by ${esc(r.model)}${r.source === "model+policy" ? ", adjusted by policy" : ""}`}
      in ${(r.latency_ms / 1000).toFixed(1)}s.</p>`;

  document.getElementById("copyBtn").onclick = async () => {
    await navigator.clipboard.writeText(document.getElementById("draft").value);
    document.getElementById("draftNote").textContent = "Copied to clipboard.";
  };
  document.getElementById("saveBtn").onclick = async () => {
    const draft_reply = document.getElementById("draft").value;
    const updated = await api(`/api/requests/${r.id}/draft`, { method: "PUT", body: JSON.stringify({ draft_reply }) });
    Object.assign(r, updated);
    document.getElementById("draftNote").textContent = "Saved.";
  };
}

async function runTriage(text, id) {
  if (busy) return;
  busy = true;
  document.getElementById("detail").innerHTML =
    `<div class="working"><i></i><span>Reading the request&hellip;</span></div>`;
  try {
    const updated = await api("/api/triage", { method: "POST", body: JSON.stringify({ text, id: id || null }) });
    requests = await api("/api/requests");
    selected = updated.id;
    drawQueue(); drawDetail();
  } catch (err) {
    document.getElementById("detail").innerHTML =
      `<p class="empty">Triage could not run: ${esc(err.message)}. Check the server is running and a key is set, then try again.</p>`;
  } finally {
    busy = false;
  }
}

document.getElementById("rows").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  selected = row.dataset.id;
  drawQueue(); drawDetail();
});

document.getElementById("newBtn").onclick = () => {
  const box = document.getElementById("newText");
  const text = box.value.trim();
  if (!text) { box.focus(); return; }
  box.value = "";
  runTriage(text, null);
};

document.getElementById("resetBtn").onclick = async () => {
  await api("/api/reset", { method: "POST" });
  requests = await api("/api/requests");
  selected = null;
  drawQueue();
  document.getElementById("detail").innerHTML =
    `<p class="empty">Pick a request from the queue, or paste a new one to see how it gets triaged.</p>`;
};

(async function start() {
  const health = await api("/api/health");
  document.getElementById("engine").textContent = health.model || "no model configured";
  requests = await api("/api/requests");
  drawQueue();
})();
</script>
</body>
</html>
